<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep-Live-Cam - Web UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 0;
            min-height: 600px;
        }

        .sidebar {
            background: #f8f9fa;
            padding: 30px;
            border-right: 1px solid #e0e0e0;
        }

        .video-container {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
        }

        .section h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            margin-right: 10px;
            border-radius: 2px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }

        .upload-area.has-file {
            border-color: #28a745;
            background: #f0fff4;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c82333;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .checkbox-group {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .checkbox-item:last-child {
            margin-bottom: 0;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-item label {
            cursor: pointer;
            user-select: none;
        }

        .video-stream {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-active {
            background: #28a745;
            box-shadow: 0 0 10px #28a745;
        }

        .status-inactive {
            background: #dc3545;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.show {
            display: block;
        }

        .placeholder {
            color: #999;
            padding: 100px 20px;
            text-align: center;
            font-size: 1.2em;
        }

        input[type="file"] {
            display: none;
        }

        .camera-info {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Deep-Live-Cam</h1>
            <p>Real-time face swapping in your browser</p>
        </div>

        <div class="main-content">
            <!-- Sidebar Controls -->
            <div class="sidebar">
                <div id="alertBox" class="alert"></div>

                <!-- Source Face Upload -->
                <div class="section">
                    <h3>1. Source Face</h3>
                    <label for="sourceUpload" class="upload-area" id="uploadArea">
                        <div class="upload-icon">📸</div>
                        <div id="uploadText">Click to upload source face</div>
                        <div style="font-size: 0.9em; color: #666; margin-top: 5px;">
                            Select an image with a clear face
                        </div>
                    </label>
                    <input type="file" id="sourceUpload" accept="image/*">
                </div>

                <!-- Camera Controls -->
                <div class="section">
                    <h3>2. Camera</h3>
                    <button id="startBtn" class="btn btn-primary" disabled>
                        🎥 Start Camera
                    </button>
                    <button id="stopBtn" class="btn btn-danger" style="display:none;">
                        ⏹️ Stop Camera
                    </button>
                    <div class="camera-info">
                        <strong>Status:</strong> 
                        <span id="cameraStatus">
                            <span class="status-indicator status-inactive"></span>
                            Not Running
                        </span>
                    </div>
                </div>

                <!-- Options -->
                <div class="section">
                    <h3>3. Options</h3>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="manyFacesCheck">
                            <label for="manyFacesCheck">Swap Multiple Faces</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="mirrorCheck">
                            <label for="mirrorCheck">Mirror Video</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Video Display -->
            <div class="video-container">
                <div id="videoPlaceholder" class="placeholder">
                    👆 Upload a source face and start camera
                </div>
                <img id="videoStream" class="video-stream" style="display:none;" src="/video_feed" alt="Live Stream">
            </div>
        </div>
    </div>

    <script>
        let cameraActive = false;
        let sourceUploaded = false;

        // Elements
        const sourceUpload = document.getElementById('sourceUpload');
        const uploadArea = document.getElementById('uploadArea');
        const uploadText = document.getElementById('uploadText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const videoStream = document.getElementById('videoStream');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const cameraStatus = document.getElementById('cameraStatus');
        const manyFacesCheck = document.getElementById('manyFacesCheck');
        const mirrorCheck = document.getElementById('mirrorCheck');
        const alertBox = document.getElementById('alertBox');

        // Upload source face
        sourceUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            showAlert('Uploading and analyzing face...', 'info');

            try {
                const response = await fetch('/upload_source', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    sourceUploaded = true;
                    uploadArea.classList.add('has-file');
                    uploadText.textContent = '✓ Source face loaded: ' + file.name;
                    startBtn.disabled = false;
                    showAlert('✓ Source face loaded successfully!', 'success');
                } else {
                    showAlert('✗ Error: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('✗ Upload failed: ' + error.message, 'error');
            }
        });

        // Start camera
        startBtn.addEventListener('click', async () => {
            if (!sourceUploaded) {
                showAlert('Please upload a source face first', 'error');
                return;
            }

            startBtn.disabled = true;
            showAlert('Starting camera...', 'info');

            try {
                const response = await fetch('/start_camera', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({camera_index: 0})
                });

                const data = await response.json();

                if (response.ok) {
                    cameraActive = true;
                    videoPlaceholder.style.display = 'none';
                    videoStream.style.display = 'block';
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'block';
                    cameraStatus.innerHTML = '<span class="status-indicator status-active"></span>Running';
                    showAlert('✓ Camera started! Face swapping active.', 'success');
                } else {
                    startBtn.disabled = false;
                    showAlert('✗ Error: ' + data.error, 'error');
                }
            } catch (error) {
                startBtn.disabled = false;
                showAlert('✗ Failed to start camera: ' + error.message, 'error');
            }
        });

        // Stop camera
        stopBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/stop_camera', {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok) {
                    cameraActive = false;
                    videoStream.style.display = 'none';
                    videoPlaceholder.style.display = 'block';
                    videoPlaceholder.textContent = 'Camera stopped. Click Start to resume.';
                    stopBtn.style.display = 'none';
                    startBtn.style.display = 'block';
                    startBtn.disabled = false;
                    cameraStatus.innerHTML = '<span class="status-indicator status-inactive"></span>Stopped';
                    showAlert('Camera stopped', 'success');
                }
            } catch (error) {
                showAlert('✗ Failed to stop camera: ' + error.message, 'error');
            }
        });

        // Toggle many faces
        manyFacesCheck.addEventListener('change', async (e) => {
            await fetch('/toggle_many_faces', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({enabled: e.target.checked})
            });
        });

        // Toggle mirror
        mirrorCheck.addEventListener('change', async (e) => {
            await fetch('/toggle_mirror', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({enabled: e.target.checked})
            });
        });

        // Show alert
        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = 'alert alert-' + (type === 'success' ? 'success' : 'error') + ' show';
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3000);
        }

        // Check status on load
        fetch('/status')
            .then(r => r.json())
            .then(data => {
                if (data.source_loaded) {
                    sourceUploaded = true;
                    uploadArea.classList.add('has-file');
                    uploadText.textContent = '✓ Source face loaded';
                    startBtn.disabled = false;
                }
            });
    </script>
</body>
</html>
